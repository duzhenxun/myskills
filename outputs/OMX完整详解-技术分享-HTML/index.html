<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <title>OMX 完整详解 · HTML 技术分享</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
  <link rel="stylesheet" href="shared/index.css">
</head>
<body>
  <main class="deck" aria-label="OMX 技术分享幻灯片">
    <div class="stage-shell"><iframe id="stage" title="当前幻灯片" src="slides/01.html" allowfullscreen></iframe></div>
  </main>

  <aside class="notes" id="notes" aria-hidden="true">
    <h2 id="notesTitle"></h2>
    <div class="notes-meta" id="notesMeta"></div>
    <p id="notesBody"></p>
  </aside>

  <nav class="controls" aria-label="幻灯片控制">
    <button class="control" id="prev" type="button" aria-label="上一页" title="上一页">‹</button>
    <div class="counter" id="counter">01 / 16</div>
    <button class="control" id="next" type="button" aria-label="下一页" title="下一页">›</button>
    <button class="control" id="toggleNotes" type="button" aria-label="讲者备注" title="讲者备注">▤</button>
    <button class="control" id="fullscreen" type="button" aria-label="全屏" title="全屏">⛶</button>
  </nav>
  <div class="progress"><span id="progress"></span></div>

  <script>
    const slides = [
      { title: 'OMX：给 Codex 加上一套可执行的工程工作流', label: '封面', notes: '开场问题：当一次 Codex 会话从改一个函数，变成澄清需求、评审方案、并行实现和验证交付时，缺少的通常不是模型能力，而是工作组织方式。本分享以本机 oh-my-codex v0.20.2 为事实基线。' },
      { title: '复杂任务的瓶颈，常常是上下文和执行纪律', label: '问题', notes: '不要把问题描述成 Codex 不够强。边界失真、阶段混杂、状态漂移和并行失控，是复杂工程任务天然需要控制面解决的问题。' },
      { title: 'OMX 不替代 Codex，它负责组织 Codex 的工作', label: '定位', notes: '纠正分类偏差：OMX 不是另一个模型、IDE 或代码生成器。Codex 负责实际推理、编辑和命令执行；OMX 提供编排与运行层。' },
      { title: '四类机制共同构成 OMX 的工程运行层', label: '架构', notes: 'AGENTS 提供规范，Skills 提供流程，Hooks 与 .omx 状态提供连续性，tmux、worktree 和 Team 提供持久并行。' },
      { title: '推荐主线先消除三类风险：歧义、方案缺口、执行漂移', label: '主线', notes: 'deep-interview、ralplan、ultragoal 是复杂任务的推荐默认路径，不是所有小任务都必须经过的不可跳过流水线。' },
      { title: '按任务形状选择执行脊柱，而不是堆叠所有 Skill', label: '执行模式', notes: '先判断任务需要持久目标、单一负责人、持久并行还是完整监督，再选择最小充分的执行方式。' },
      { title: 'Team 的价值不是多开 Agent，而是建立协作协议', label: 'Team', notes: '小型、会话内的独立分工优先使用 Codex native subagents。Team 用于需要持久 tmux、任务状态、邮箱、worktree 和生命周期控制的场景。' },
      { title: '每个 Team Worker 默认拥有独立 worktree', label: '隔离', notes: 'worktree 隔离并行编辑面，但共享文件、跨模块契约和最后集成仍可能发生冲突。它降低冲突概率，不保证自动无冲突合并。' },
      { title: '一次 Team 任务的生命周期可被观察和恢复', label: '生命周期', notes: '可恢复来自持久任务、邮箱、状态和 tmux 运行时；不等于业务操作自动回滚。关闭 Team 前必须确认 pending、in_progress 和失败路径都已处理。' },
      { title: '三分钟演示：从任务描述到三条并行验证链', label: '演示', notes: '现场演示应选择可在数分钟内完成、文件所有权清晰的任务。重点展示任务分解、状态转换和验证证据，而不是并发 pane 数量。' },
      { title: '安装成功，不等于真实执行链路已经可用', label: '安装', notes: 'omx doctor 检查安装形态和本地运行时，不证明模型请求一定成功。还需真实 Codex 请求验证认证、profile 和 provider/base URL 链路。' },
      { title: '第一次使用，先跑一条最短的可信闭环', label: '首次使用', notes: 'shell 命令负责安装、检查和启动；会话内 Skill 负责澄清、规划和执行。--madmax 会绕过审批与沙箱，不应作为基础演示默认值。' },
      { title: 'OMX 的核心收益，是可重复的工程纪律', label: '收益', notes: '不要给出没有基准数据支持的效率提升倍数。真实收益取决于任务拆分质量、仓库测试能力和团队规则。' },
      { title: '边界讲清楚，才能正确使用 OMX', label: '边界', notes: 'MCP 是可选兼容模式；CodeGraph 不由 OMX 自动安装和索引；Team 不保证无冲突合并；当前文档化的 worker CLI 主要是 Codex 与 Claude。' },
      { title: '不同工具解决不同层：不要把编排、IDE 与 Agent CLI 混为一类', label: '比较', notes: '这是任务适配矩阵，不是产品优劣排名。避免使用未经当前官方证据支持的绝对表述。' },
      { title: '从一条可信闭环开始，再把复杂度交给编排', label: '采用建议', notes: '用一个可测量的真实试点验证边界、状态和完成证据是否改善。建议分享约 25 分钟，另留 5 到 10 分钟问答。' }
    ];

    const stage = document.getElementById('stage');
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');
    const notes = document.getElementById('notes');
    const notesTitle = document.getElementById('notesTitle');
    const notesMeta = document.getElementById('notesMeta');
    const notesBody = document.getElementById('notesBody');
    const hashIndex = Number.parseInt(location.hash.slice(1), 10);
    const savedIndex = Number.parseInt(localStorage.getItem('omx-dom-deck-index'), 10);
    const initialIndex = Number.isFinite(hashIndex) ? hashIndex - 1 : (Number.isFinite(savedIndex) ? savedIndex : 0);
    let index = Math.max(0, Math.min(slides.length - 1, initialIndex));
    let notesOpen = false;

    function render(replace = false) {
      const number = String(index + 1).padStart(2, '0');
      stage.classList.add('loading');
      stage.src = 'slides/' + number + '.html';
      stage.title = slides[index].title;
      counter.textContent = number + ' / ' + String(slides.length).padStart(2, '0');
      progress.style.width = ((index + 1) / slides.length * 100) + '%';
      notesTitle.textContent = slides[index].title;
      notesMeta.textContent = number + ' · ' + slides[index].label;
      notesBody.textContent = slides[index].notes;
      localStorage.setItem('omx-dom-deck-index', String(index));
      const hash = '#' + (index + 1);
      replace ? history.replaceState(null, '', hash) : history.pushState(null, '', hash);
    }

    function go(delta) {
      const nextIndex = Math.max(0, Math.min(slides.length - 1, index + delta));
      if (nextIndex === index) return;
      index = nextIndex;
      render();
    }

    function goTo(nextIndex) {
      index = Math.max(0, Math.min(slides.length - 1, nextIndex));
      render();
    }

    function toggleNotes(force) {
      notesOpen = typeof force === 'boolean' ? force : !notesOpen;
      notes.classList.toggle('open', notesOpen);
      notes.setAttribute('aria-hidden', String(!notesOpen));
    }

    async function toggleFullscreen() {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
      else await document.exitFullscreen?.();
    }

    function act(action) {
      if (action === 'next') go(1);
      if (action === 'prev') go(-1);
      if (action === 'first') goTo(0);
      if (action === 'last') goTo(slides.length - 1);
      if (action === 'notes') toggleNotes();
      if (action === 'fullscreen') toggleFullscreen();
    }

    document.getElementById('prev').onclick = () => act('prev');
    document.getElementById('next').onclick = () => act('next');
    document.getElementById('toggleNotes').onclick = () => act('notes');
    document.getElementById('fullscreen').onclick = () => act('fullscreen');
    stage.onload = () => stage.classList.remove('loading');
    addEventListener('message', event => event.data?.deckAction && act(event.data.deckAction));
    addEventListener('popstate', () => { index = Math.max(0, Math.min(slides.length - 1, Number(location.hash.slice(1)) - 1 || 0)); render(true); });
    addEventListener('mousemove', () => { document.body.classList.add('show-controls'); clearTimeout(window.__controlsTimer); window.__controlsTimer = setTimeout(() => document.body.classList.remove('show-controls'), 1200); });
    addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      const map = { arrowright: 'next', arrowdown: 'next', ' ': 'next', pagedown: 'next', arrowleft: 'prev', arrowup: 'prev', pageup: 'prev', home: 'first', end: 'last', n: 'notes', f: 'fullscreen' };
      if (key === 'escape' && notesOpen) { event.preventDefault(); toggleNotes(false); return; }
      if (!map[key]) return;
      event.preventDefault();
      act(map[key]);
    });

    render(true);
  </script>
</body>
</html>
