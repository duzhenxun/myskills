    <div class="problem-grid">
      <section class="problem-item enter"><span class="num">01</span><h2>边界失真</h2><p>需求边界未锁定，模型可能快速推进到错误答案</p></section>
      <section class="problem-item enter delay-1"><span class="num">02</span><h2>阶段混杂</h2><p>计划、实现、验证混在一起，难以审查完成度。</p></section>
      <section class="problem-item enter delay-2"><span class="num">03</span><h2>状态漂移</h2><p>长任务跨回合后，目标、证据和未完成项容易丢失。</p></section>
      <section class="problem-item enter delay-3"><span class="num">04</span><h2>并行失控</h2><p>没有所有权与交接协议，多 Agent 只会放大冲突。</p></section>
