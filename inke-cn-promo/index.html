      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      function drawPath(selector, at, duration) {
        document.querySelectorAll(selector).forEach(function (path) {
          var length = path.getTotalLength();
          path.style.strokeDasharray = length;
          path.style.strokeDashoffset = length;
          tl.to(path, { strokeDashoffset: 0, duration: duration, ease: "power2.out" }, at);
        });
      }

      function sceneIn(selector, at) {
        tl.fromTo(selector, { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power2.out" }, at);
      }

      function sceneOut(selector, at) {

        tl.set(selector, { opacity: 0 }, at + 0.39);
      }

      tl.set(["#scene-1", "#scene-2", "#scene-3", "#scene-4"], { opacity: 0 }, 0);

      sceneIn("#scene-1", 0);
      tl.fromTo(".s1-stage", { opacity: 0, x: -90, y: 26, scale: 0.92, rotationY: 8 }, { opacity: 1, x: 0, y: 0, scale: 1, rotationY: 0, duration: 0.78, ease: "power3.out" }, 0.14);

      tl.fromTo(".s1-title .word", { opacity: 0, y: 42, x: 46 }, { opacity: 1, y: 0, x: 0, stagger: 0.12, duration: 0.42, ease: "power2.out" }, 0.78);
      drawPath(".underline-path", 1.28, 0.56);
      tl.fromTo(".s1-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 1.55);
      tl.to(".s1-stage img", { scale: 1.035, duration: 4.7, ease: "none" }, 0.25);
      tl.to(".s1-glow", { scale: 1.12, x: 40, yoyo: true, repeat: 3, duration: 1.1, ease: "sine.inOut" }, 0.2);
      tl.to(".s1-ring", { rotation: 18, scale: 1.07, yoyo: true, repeat: 2, duration: 1.5, ease: "sine.inOut" }, 0.4);
      tl.to(".s1-dot-a, .s1-dot-b", { y: -28, yoyo: true, repeat: 4, duration: 0.9, ease: "sine.inOut" }, 0.1);
